publiccodeYmlVersion: "0.4"

name: GTFS.zone Wifi Pipeline
url: "https://github.com/gtfs-zone/gtfs-zone-wifi-pipeline"
landingURL: "https://viz.wifi.gtfs.zone"

platforms:
  - linux

categories:
  - data-analytics
  - data-collection

developmentStatus: concept

softwareType: "standalone/backend"

description:
  en:
    shortDescription: >
      A Dagster pipeline that turns crowdsourced transit wifi sessions into open aggregates.
    longDescription: >
      GTFS.zone Wifi Pipeline processes the raw sessions uploaded by the
      wifi.gtfs.zone app. It matches measurements to GTFS shapes and stops,
      aggregates wifi, cell coverage and amenity reports per trip segment,
      route and area, and publishes the results as open data (ODbL) in JSON
      and PMTiles.
    features:
      - Snapping measurements to GTFS shapes
      - Aggregates per trip segment, route and area
      - Open data publishing as JSON and PMTiles

