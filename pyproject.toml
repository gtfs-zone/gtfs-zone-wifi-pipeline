[project]
name = "gtfs-zone-wifi-pipeline"
version = "0.0.0"
requires-python = ">=3.13"
description = "Dagster code location that turns raw wifi.gtfs.zone sessions into published aggregates"
license = "AGPL-3.0-or-later"
dependencies = [
    "dagster==1.13.24",
    "dagster-postgres==0.29.24",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "obstore>=0.12.1",
    "polyline>=2.0.4",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "dagster-webserver==1.13.24",
    "deptry>=0.25.1",
    "pmtiles>=3.8.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_wifi_pipeline"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.deptry]
per_rule_ignores.DEP002 = [
    "dagster-postgres",  # run storage, named in the infra dagster.yaml
    "sqlalchemy",  # pinned for the run storage driver
]

[tool.vulture]
paths = ["src"]
# defs: loaded by `dagster api grpc -m`. length_m: published through asdict.
ignore_names = ["defs", "length_m"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): bump version $current_version -> $new_version"
annotated_tag = true
pre_bump_hooks = [
    "bash -c 'branch=$(git branch --show-current); [ \"$branch\" = \"main\" ] || { echo \"Error: cz bump must be run on main (currently on \\\"$branch\\\")\"; exit 1; }'",
]
